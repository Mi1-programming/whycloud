<!DOCTYPE html>
<html>
	<head>
		<title>Whycloud</title>
		<link rel="stylesheet" href="static/main.css" />
	</head>
	<body>
		<div class="vflex cvflex gap32">
			<h1 class="center">Whycloud</h1>
			<h2 class="center">Explore</h2>
			<div class="vflex gap16">
				<button>
					<div class="hflex cvflex gap8">
						<img src="/static/icons/search.svg"/>
						<input class="fill" type="search" placeholder="Search" />
					</div>
				</button>
				<div closed id="tagExplore" class="hflex gap16">
					<div id="tags">
						<div id="moreFade"></div>
					</div>
					<button id="more"></button>
				</div>
			</div>
			
			<h2 class="center">Files</h2>
			<div class="vflex cvflex gap16">
				<div class="hflex gap8">
					<button id="upload" class="hflex cvflex gap8" onclick="location.assign('new')">
						<img src="/static/icons/upload.svg"/>
						<p>Upload</p>
					</button>
					<button id="download" class="hflex cvflex gap8">
						<img src="/static/icons/download.svg"/>
						<p>Download Selected</p>
					</button>
					<button id="remove" class="hflex cvflex gap8">
						<img src="/static/icons/delete.svg"/>
						<p>Delete Selected</p>
					</button>
					<button id="deselect">Deselect</button>
				</div>
				<table id="cloud">
					<tr>
						<th></th>
						<th>Name</th>
						<th>Uploaded</th>
						<th>Tags</th>
					</tr>
				</table>
			</div>
		</div>
		<script type="module">
			import dom from "/static/scripts/dom.js";
			import fileJS from "/static/scripts/file.js";

			const tags = await fileJS.FetchJSON("/tags")
			tags.forEach((tag) => {
				const item = new dom.Tag(
					tag.name,
					tag.color
				)
				item.MakeDom("tags")
			})

			const data = await fileJS.FetchJSON("/getPage")

			data.forEach(elem => {
				fileJS.DecodeObj64(elem.user)
				const item = new dom.File(
					elem.id,
					[
						elem.user.name,
						new Date(elem.uploaded).toLocaleString()
					],
					[
						"School"
					]
				);
				item.MakeDom("cloud");
			});

			const tagExplore = document.getElementById("tagExplore")
			const moreButton = document.getElementById("more")
			const closeAttribute = "closed"
			moreButton.addEventListener("click", () => {
				const isClosed = tagExplore.getAttribute(closeAttribute)
				if (isClosed == undefined) {
					tagExplore.setAttribute(closeAttribute, "")
					return
				}
				tagExplore.removeAttribute(closeAttribute)
			});

			const deselect = document.getElementById("deselect")
			deselect.addEventListener("click", () => {
				for (const [key, value] of Object.entries(dom.selected)) {
					value.Deselect()
				}
			})
			const download = document.getElementById("download")
			download.addEventListener("click", async () => {
				for await (const [key, value] of Object.entries(dom.selected)) {
					value.Download()
				}
			})
			const remove = document.getElementById("remove")
			remove.addEventListener("click", async () => {
				const names = []
				const data = {
					ids: []
				}
				for (const [key, value] of Object.entries(dom.selected)) {
					data.ids.push(key)
					console.log(value)
					names.push(value.props[0])
				}

				if (confirm(`Do you want to remove the files: ${names.join(", ")}?`)) {
					const deleteString = JSON.stringify(data)
					fileJS.FetchSendJSON("/dodel", deleteString)
					location.reload();
				}
			})
		</script>
	</body>
</html>
