<!DOCTYPE html>
<html>
	<head>
		<title>Whycloud</title>
		<link rel="stylesheet" href="static/main.css" />
	</head>
	<body>
		<div class="vflex gap16">
			<div class="hflex">
				<button onclick="location.assign('new')">Upload</button>
			</div>
			<table id="cloud">
				<tr>
					<th>Name</th>
					<th>Description</th>
					<th>Uploaded</th>
					<th>Actions</th>
				</tr>
			</table>
		</div>
		<script type="module">
			import dom from "/static/scripts/dom.js";

			function FromBase64(data) {
				const binString = atob(data);
				const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
				return new TextDecoder().decode(bytes)
			}

			const page = await fetch("/getPage");
			const body = await page.text()
			const jBody = JSON.parse(body)

			jBody.forEach(elem => {
				for (const [key, value] of Object.entries(elem.user)) {
					elem.user[key] = FromBase64(elem.user[key]);
				}
			});
			jBody.forEach(elem => {
				const item = new dom.File(
					elem.id,
					[
						elem.user.name,
						elem.user.desc,
						new Date(elem.uploaded).toLocaleString()
					]
				);
				item.MakeDom("cloud");
			});
		</script>
	</body>
</html>
