<!DOCTYPE html>
<html>
	<head>
		<title>Whycloud</title>
		<link rel="stylesheet" href="static/main.css" />
	</head>
	<body>
		<div class="vflex cvflex gap32">
			<h1 class="center">Whycloud</h1>
			<h2 class="center">Explore</h2>
			<div class="vflex gap16">
				<button>
					<div class="hflex cvflex gap8">
						<img src="/static/icons/search.svg" />
						<input id="search" class="fill" type="search" placeholder="Search" />
					</div>
				</button>
				<div closed id="tagExplore" class="hflex gap16">
					<div id="tags">
						<div id="moreFade"></div>
					</div>
					<button id="more"></button>
				</div>
			</div>

			<h2 class="center">Files</h2>
			<div class="vflex cvflex gap16">
				<button
					id="upload"
					class="hflex cvflex gap8"
					onclick="location.assign('new')"
				>
					<img src="/static/icons/upload.svg" />
					<p>Upload</p>
				</button>
				<div class="hflex wflex jflex gap8">
					<button id="download" class="hflex cvflex gap8">
						<img src="/static/icons/download.svg" />
						<p>Download Selected</p>
					</button>
					<button id="remove" class="hflex cvflex gap8">
						<img src="/static/icons/delete.svg" />
						<p>Delete Selected</p>
					</button>
					<button id="deselect">Deselect</button>
				</div>
				<table id="cloud">
					<tr>
						<th></th>
						<th>Name</th>
						<th>Uploaded</th>
						<th>Tags</th>
					</tr>
				</table>
			</div>
		</div>
		<script type="module">
			import dom from "/static/scripts/dom.js";
			import fileJS from "/static/scripts/file.js";

			const selectedFiles = {};
			const selectedTags = {};
			const domTags = {};

			const urlVariables = fileJS.GetURLParams();
			const tagsElement = document.getElementById("tags");
			const cloudElement = document.getElementById("cloud");

			const tagFetch = await fileJS.FetchJSON("/tags");
			tagFetch.tags.forEach((tag) => {
				const domTag = new dom.Tag(
					tag.id,
					selectedTags,
					tag.name,
					tag.color,

					// When we click. We want to toggle this tag in the URL
					() => {
						const newTagSearch = [];

						// Add previously selected tags to the array

						for (const key in selectedTags) {
							newTagSearch.push(key);
						}

						// Toggle the new tag

						const tagIndex = newTagSearch.indexOf(tag.id.toString());
						if (tagIndex == -1) {
							newTagSearch.push(tag.id);
						} else {
							newTagSearch.splice(tagIndex, 1);
						}

						// Building the URL

						const parameters = new URLSearchParams();

						// Start with the current URL variables

						for (const [key, value] of Object.entries(urlVariables)) {
							parameters.append(key, value);
						}

						// Rebuild the tag property

						if (newTagSearch.length == 0) {
							parameters.delete("tag");
						} else {
							const tagString = newTagSearch.join(",");
							parameters.set("tag", tagString);
						}

						// Navigate to the new URL

						const stringParameters = parameters.toString();
						location.assign(`../?${stringParameters}`);
					}
				);

				domTags[tag.id] = domTag;
				domTag.MakeDom(tagsElement);
			});

			const fileFetch = await fileJS.FetchJSON("/files");

			// Decode file fields

			fileFetch.files.forEach((file) => {
				file.name = fileJS.Decode64(file.name);
			});

			// If there are active tag filters; Filter out files not mathing *ALL* tags

			let numberFilterTags = [];
			const filterTags = urlVariables.tag;
			if (filterTags != undefined) {
				// Extract an array of numbers from a URL variable
				const parsedFilterTags = filterTags.split(",");
				numberFilterTags = parsedFilterTags.map((tag) => parseInt(tag));

				fileFetch.files = fileFetch.files.filter((file) => {
					for (const tagId of numberFilterTags) {
						const match = file.tags.includes(tagId);
						if (match) continue;
						return false;
					}
					return true;
				});
			}

			// If there is a search active; Filter out files not matching it

			const search = urlVariables.search;
			if (search != undefined) {
				const lowerSearch = search.toLowerCase();
				fileFetch.files = fileFetch.files.filter((file) => {
					const lowerName = file.name.toLowerCase();
					const match = lowerName.includes(lowerSearch);
					return match;
				});
			}

			// Build the files to the dom

			fileFetch.files.forEach((file) => {
				const fileDomTags = [];
				file.tags.forEach((tagId) => {
					fileDomTags.push(domTags[tagId]);
				});

				const item = new dom.File(
					file.id,
					selectedFiles,
					[file.name, new Date(file.uploaded).toLocaleString()],
					fileDomTags
				);
				item.MakeDom(cloudElement);
			});

			// Select tags described in the URL

			numberFilterTags.forEach((tagId) => {
				const domTag = domTags[tagId];
				domTag.Select();
			});

			const searchElement = document.getElementById("search");
			if (search != undefined) searchElement.value = search;
			searchElement.addEventListener("keypress", (e) => {
				if (e.key == "Enter") {
					event.preventDefault();

					// Building a new URL

					const parameters = new URLSearchParams();

					// Start with the previous parameters

					for (const [key, value] of Object.entries(urlVariables)) {
						parameters.append(key, value);
					}

					// Rebuild the serach parameter

					if (e.target.value == "") {
						parameters.delete("search");
					} else {
						parameters.set("search", e.target.value);
					}

					// Navigate to the new URL

					const stringParameters = parameters.toString();
					location.assign(`../?${stringParameters}`);
				}
			});

			const tagExplore = document.getElementById("tagExplore");
			const moreButton = document.getElementById("more");
			const closeAttribute = "closed";
			moreButton.addEventListener("click", () => {
				const isClosed = tagExplore.getAttribute(closeAttribute);
				if (isClosed == undefined) {
					tagExplore.setAttribute(closeAttribute, "");
					return;
				}
				tagExplore.removeAttribute(closeAttribute);
			});

			const deselect = document.getElementById("deselect");
			deselect.addEventListener("click", () => {
				for (const [key, value] of Object.entries(selectedFiles)) {
					value.Deselect();
				}
			});

			const download = document.getElementById("download");
			download.addEventListener("click", async () => {
				for await (const [key, value] of Object.entries(selectedFiles)) {
					value.Download();
				}
			});

			const remove = document.getElementById("remove");
			remove.addEventListener("click", async () => {
				const names = [];
				const data = {
					ids: [],
				};
				for (const [key, value] of Object.entries(selectedFiles)) {
					data.ids.push(key);
					names.push(value.props[0]);
				}

				if (confirm(`Do you want to remove the files: ${names.join(", ")}?`)) {
					const deleteString = JSON.stringify(data);
					fileJS.FetchJSON("/deleteFile", deleteString);
					location.reload();
				}
			});
		</script>
	</body>
</html>
