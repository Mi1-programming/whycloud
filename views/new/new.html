<!DOCTYPE html>
<html>
	<head>
		<title>Whycloud - New</title>
		<link rel="stylesheet" href="static/main.css" />
	</head>
	<body>
		<div class="vflex cvflex gap16">
			<h1>Upload a File</h1>
			<div class="hflex gap8">
				<label for="upload">File</label>
				<input id="upload" class="pad4" type="file" />
			</div>
			<div class="hflex gap8">
				<button id="submit">Upload</button>
				<button id="back">Back</button>
			</div>
		</div>
		<script type="module">
			import fileJS from "/static/scripts/file.js";

			const upload = document.getElementById("upload");
			const submit = document.getElementById("submit");
			submit.addEventListener("click", (e) => {
				const file = upload.files[0];

				if (file == undefined) {
					console.warn("Uploaded file was undefined");
					return;
				}

				// Reading the data of the uploaded file into base64

				const reader = new FileReader();
				reader.onload = async (e) => {
					const encodedName = fileJS.Encode64(file.name);
					const body = {
						name: encodedName,
					};

					const uint8Arr = new Uint8Array(reader.result);
					const data = fileJS.BytesToBase64(uint8Arr);
					body.file = data;

					const strBody = JSON.stringify(body);

					// Upload the file
					await fileJS.FetchJSON("/newFile", strBody);

					// Go back to the previos page, and refresh
					location.assign(document.referrer);
				};
				reader.readAsArrayBuffer(file);
			});

			const back = document.getElementById("back");
			back.addEventListener("click", () => {
				// Go back to the previos page
				history.back();
			});
		</script>
	</body>
</html>
